<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Categorías</title>

    <link rel="stylesheet" href="/frontend/styles/styles.css">
    <link rel="stylesheet" href="/frontend/styles/seleccionar_categoria.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

</head>

<body>

    <div class="contenedor-categorias">

        <h1>SELECCIONAR CATEGORÍA</h1>

        <div class="cards">

            <div class="card" data-id="1">

                <img
                    src="/public/LOGO PELICULAS.png"
                    alt="Series"
                >

                <span>
                    PERSONAJES DE SERIES Y PELÍCULAS
                </span>

            </div>

            <div class="card" data-id="2">

                <img
                    src="/public/LOGO JUEGOS.png"
                    alt="Videojuegos"
                >

                <span>
                    VIDEOJUEGOS
                </span>

            </div>

            <div class="card" data-id="3">

                <img
                    src="/public/LOGO DEPORTES.png"
                    alt="Deportes"
                >

                <span>
                    DEPORTES
                </span>

            </div>

            <div class="card" data-id="4">

                <img
                    src="/public/LOGO MUSICA.png"
                    alt="Música"
                >

                <span>
                    MÚSICA
                </span>

            </div>

        </div>

        <input
            type="hidden"
            id="categoria"
        >

        <button id="btnComenzar">
            COMENZAR PARTIDA
        </button>

    </div>

    <script src="/frontend/scripts/categoria.js"></script>

</body>

</html>
