<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Ahorcado</title>
    <link rel="stylesheet" href="/frontend/styles/juego.css">

</head>

<body>
    <img src="/public/image.png" id="logo">

    <video autoplay muted loop id="matrix-video">
        <source src="/public/video_menu.mp4" type="video/mp4">
    </video>

    <div class="contenedor">

        <div class="infoPartida">

            <h2 id="ronda">
                Ronda 1 / 10
            </h2>

            <h2 id="dificultad">
                Dificultad:
            </h2>

            <h2 id="vidas" class="stat-vidas">
                Vidas: ❤️❤️❤️
            </h2>

            <h2 id="puntaje">
                Puntaje: 0
            </h2>

        </div>

        <div class="zonaJuego">

            <div class="encabezadoJuego">
                <h3 id="categoria">
                    Categoría:
                </h3>
                <div id="pista" class="pista-oculta">
                    Pista: ---
                </div>
            </div>

            <div id="palabra">
                _ _ _ _ _ _ _ _
            </div>

        </div>

        <div class="accionesJuego arribaTeclado">
            <button id="btnPista">Usar pista</button>
        </div>

        <div id="teclado"></div>

        <div class="accionesJuego">
            <button id="btnSalir" class="btnSalir">Salir de la partida</button>
        </div>
    </div>

    <script src="/frontend/scripts/juego.js"></script>
    <script src="/frontend/scripts/puntaje.js"></script>

</body>

</html>
