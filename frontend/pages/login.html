<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>Iniciar Sesión</title>

    <link rel="stylesheet" href="/frontend/styles/general.css">
    <link rel="stylesheet" href="/frontend/styles/login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>

<body>

    <video autoplay muted loop id="matrix-video">
        <source src="/frontend/videos/Matrix _ Background Video _ Screensaver.mp4" type="video/mp4">
    </video>

<div class="contenedor-login">

    <h1>INICIAR SESIÓN</h1>

    <div class="credenciales">

        <input
            type="text"
            id="usuario"
            placeholder="Usuario"
        >

        <input
            type="password"
            id="contrasena"
            placeholder="Contraseña"
        >

    </div>

    <button id="btnLogin">
        Ingresar
    </button>

    <button id="btnLoginaReg" class="registro">
        ¿No tenés cuenta? Registrate
    </button>

</div>
    <script src="/frontend/scripts/login.js"></script>

</body>
</html>
